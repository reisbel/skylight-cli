[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skylight-cli"
version = "0.3.0"
description = "Unofficial CLI for Skylight Calendar chores and lists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Reisbel Machado" }]
keywords = ["skylight", "calendar", "chores", "family"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/reisbel/skylight-cli"
Issues = "https://github.com/reisbel/skylight-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skylight = "skylight_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skylight_cli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
